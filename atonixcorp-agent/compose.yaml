services:
  agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: atonixcorp-agent:local
    container_name: atonixcorp-agent
    init: true
    restart: unless-stopped
    environment:
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:?Set AGENT_API_TOKEN before starting the container}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - agent-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  agent-data:
