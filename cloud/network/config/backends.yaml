backends:
  ovn:
    enabled: true
    nbctl_path: "/usr/bin/ovn-nbctl"
    sbctl_path: "/usr/bin/ovn-sbctl"
    bridge: "br-int"

  frr:
    enabled: true
    config_path: "/etc/frr/frr.conf"
    reload_command: "systemctl reload frr"

  dnsmasq:
    enabled: true
    config_dir: "/etc/dnsmasq.d"

  datacenter:
    enabled: true
    mode: "vxlan"        # vlan | vxlan
    vlan_range: "100-4000"
    vni_range: "10000-20000"

  kubernetes:
    enabled: false       # enable when integrating K8s
    kubeconfig: "/etc/kubernetes/kubeconfig"
    cni_plugin: "ovn-kubernetes"

  neutron:
    enabled: false       # enable when integrating OpenStack
    endpoint: "https://openstack.example.com:9696"
    token: "REPLACE_ME"

  atcloud:
    enabled: false       # your custom cloud backend
    endpoint: "https://api.atcloud.local"
    token: "REPLACE_ME"

  generic:
    enabled: true        # fallback backend
