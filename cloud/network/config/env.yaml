environment:
  name: "AtonixCloud"
  region: "US New York"
  node_id: "node-001"

database:
  host: "127.0.0.1"
  port: 5432
  user: "atn"
  password: "atnpass"
  name: "atn"
  sslmode: "disable"

reconciler:
  interval_seconds: 30

logging:
  level: "info"
  file: "/var/log/atn/atn.log"

agent:
  enabled: true
  sync_interval_seconds: 15
  ovs_bridge: "br-int"
  dhcp_config_dir: "/etc/dnsmasq.d"

networking:
  external_network_id: "ext-net-001"
  bgp_asn: 65001
  bgp_neighbor: "192.0.2.1"
  bgp_neighbor_asn: 65000
