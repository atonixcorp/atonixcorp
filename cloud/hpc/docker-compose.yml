services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${HPC_DB_NAME:?set HPC_DB_NAME}"
      POSTGRES_USER: "${HPC_DB_USER:?set HPC_DB_USER}"
      POSTGRES_PASSWORD: "${HPC_DB_PASSWORD:?set HPC_DB_PASSWORD}"
    volumes:
      - hpc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12

  object-storage-config:
    image: python:3.13-alpine
    restart: "no"
    environment:
      HPC_S3_ACCESS_KEY: "${HPC_S3_ACCESS_KEY:?set HPC_S3_ACCESS_KEY}"
      HPC_S3_SECRET_KEY: "${HPC_S3_SECRET_KEY:?set HPC_S3_SECRET_KEY}"
    volumes:
      - hpc_s3_config:/config
    entrypoint:
      - python3
      - -c
      - |
        import json, os
        configuration = {"identities": [{"name": "atonixcorp-hpc", "credentials": [{"accessKey": os.environ["HPC_S3_ACCESS_KEY"], "secretKey": os.environ["HPC_S3_SECRET_KEY"]}], "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
        with open("/config/s3.json", "w", encoding="utf-8") as output:
            json.dump(configuration, output)

  object-storage:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.config=/config/s3.json", "-s3.port=9000"]
    volumes:
      - hpc_object_data:/data
      - hpc_s3_config:/config:ro
    expose:
      - "9000"
    depends_on:
      object-storage-config:
        condition: service_completed_successfully

  hpc:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HPC_SERVICE_NAME: atonixcorp-hpc
      HPC_SERVICE_PORT: "8080"
      HPC_METRICS_PORT: "9090"
      HPC_JWT_SIGNING_KEY: "${HPC_JWT_SIGNING_KEY:?set HPC_JWT_SIGNING_KEY}"
      HPC_DEFAULT_BACKEND: "${HPC_DEFAULT_BACKEND:-none}"
      HPC_SLURM_ENABLED: "${HPC_SLURM_ENABLED:-false}"
      HPC_SLURM_SBATCH_PATH: "${HPC_SLURM_SBATCH_PATH:-/usr/bin/sbatch}"
      HPC_SLURM_SQUEUE_PATH: "${HPC_SLURM_SQUEUE_PATH:-/usr/bin/squeue}"
      HPC_SLURM_SACCT_PATH: "${HPC_SLURM_SACCT_PATH:-/usr/bin/sacct}"
      HPC_SLURM_SCANCEL_PATH: "${HPC_SLURM_SCANCEL_PATH:-/usr/bin/scancel}"
      HPC_SLURM_SCONTROL_PATH: "${HPC_SLURM_SCONTROL_PATH:-/usr/bin/scontrol}"
      HPC_SLURM_COMMAND_TIMEOUT: "${HPC_SLURM_COMMAND_TIMEOUT:-10s}"
      SLURM_CONF: "${HPC_SLURM_CONFIG_PATH:-/etc/slurm/slurm.conf}"
      HPC_K8S_ENABLED: "false"
      HPC_S3_ENDPOINT: "object-storage:9000"
      HPC_S3_BUCKET: "${HPC_S3_BUCKET:-datasets}"
      HPC_S3_ACCESS_KEY: "${HPC_S3_ACCESS_KEY:?set HPC_S3_ACCESS_KEY}"
      HPC_S3_SECRET_KEY: "${HPC_S3_SECRET_KEY:?set HPC_S3_SECRET_KEY}"
      HPC_S3_SECURE: "false"
      HPC_DB_HOST: postgres
      HPC_DB_PORT: "5432"
      HPC_DB_USER: "${HPC_DB_USER:?set HPC_DB_USER}"
      HPC_DB_PASSWORD: "${HPC_DB_PASSWORD:?set HPC_DB_PASSWORD}"
      HPC_DB_NAME: "${HPC_DB_NAME:?set HPC_DB_NAME}"
      HPC_DB_SSLMODE: disable
      HPC_CLUSTER_DISCOVERY_INTERVAL: "${HPC_CLUSTER_DISCOVERY_INTERVAL:-30s}"
      HPC_CLUSTER_HEALTH_INTERVAL: "${HPC_CLUSTER_HEALTH_INTERVAL:-20s}"
      HPC_CLUSTER_HEALTH_PORT: "${HPC_CLUSTER_HEALTH_PORT:-22}"
    ports:
      - "127.0.0.1:8183:8080"
      - "127.0.0.1:9193:9090"
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  hpc_postgres_data:
  hpc_object_data:
  hpc_s3_config:
