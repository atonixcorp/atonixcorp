service:
  name: "atonixcorp-hpc"
  port: 8080

auth:
  jwt_signing_key: ""

scheduler:
  default_backend: "none"
  slurm:
    enabled: false
    sbatch_path: "/usr/bin/sbatch"
    squeue_path: "/usr/bin/squeue"
    sacct_path: "/usr/bin/sacct"
    scancel_path: "/usr/bin/scancel"
    scontrol_path: "/usr/bin/scontrol"
    command_timeout: "10s"
  k8s:
    enabled: false
    namespace: "hpc-jobs"

storage:
  s3:
    endpoint: "minio:9000"
    bucket: "datasets"
    access_key: ""
    secret_key: ""
    secure: false

database:
  postgres:
    host: "postgres"
    port: 5432
    user: ""
    password: ""
    dbname: "hpc"
    sslmode: "disable"

metrics:
  port: 9090

cluster:
  discovery_interval: "30s"
  health_interval: "20s"
  health_port: 22
