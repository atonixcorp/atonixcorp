name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  go-test:
    name: Go tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - analytics
          - api
          - cli
          - cloud/compute
          - cloud/database
          - cloud/hpc
          - cloud/network
          - container-runtime
          - devops
          - emailserver
          - orcacloud
          - orcacloud/hardware
          - security
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test ./...

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  agent:
    name: Agent tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atonixcorp-agent
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

  compose-smoke:
    name: Compose build and integration smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create ephemeral development configuration
        shell: bash
        run: |
          umask 077
          python3 - <<'PY' > .env
          import base64
          import secrets

          print(f"POSTGRES_PASSWORD={secrets.token_hex(32)}")
          print(f"JWT_SECRET={secrets.token_hex(32)}")
          print(f"CONTAINER_SECRET_KEY={base64.b64encode(secrets.token_bytes(32)).decode()}")
          print(f"COMPUTE_API_TOKEN={secrets.token_hex(32)}")
          print(f"COMPUTE_NODE_TOKEN={secrets.token_hex(32)}")
          print(f"AGENT_API_TOKEN={secrets.token_hex(32)}")
          print("AUTH_COOKIE_SECURE=false")
          print("STORAGE_DRIVER=local-file")
          print("SMTP_HOST=127.0.0.1")
          print("SMTP_PORT=587")
          print("SMTP_USER=ci")
          print(f"SMTP_PASSWORD={secrets.token_hex(32)}")
          print("SMTP_RECIPIENT=ci@example.invalid")
          PY

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the platform
        run: |
          if ! docker compose up -d --build --wait --wait-timeout 300; then
            docker compose ps --all
            docker compose logs --no-color --tail=100
            exit 1
          fi

      - name: Verify container health and service integrations
        env:
          AUTH_COOKIE_SECURE: "false"
        run: |
          docker compose ps --format '{{.Service}}|{{.State}}|{{.Health}}' |
            awk -F'|' 'NF != 3 || $2 != "running" || $3 != "healthy" {
              print "Unhealthy Compose service: " $0
              failed = 1
            } END { exit failed }'
          docker compose exec -T db pg_isready -U atonixcorp -d atonixcorp
          docker compose exec -T database /usr/local/bin/atdb-health
          docker compose exec -T compute wget -q -O /dev/null http://127.0.0.1:8580/health
          docker compose exec -T networking wget -q -O /dev/null http://127.0.0.1:8080/health
          python3 scripts/compose-smoke-test.py
          python3 scripts/compose-admin-smoke-test.py

      - name: Verify service recovery after restart
        run: |
          docker compose kill -s SIGKILL compute
          docker compose up -d --wait --wait-timeout 120
          docker compose exec -T compute wget -q -O /dev/null http://127.0.0.1:8580/health

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=100

      - name: Stop stack and remove ephemeral data
        if: always()
        run: docker compose down --volumes --remove-orphans
