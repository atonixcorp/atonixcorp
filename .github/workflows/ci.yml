name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  go-test:
    name: Go tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - analytics
          - at-web-api
          - atcli
          - cloud/atnetwork
          - cloud/compute
          - cloud/database
          - devops
          - emailserver
          - security
          - t3cloud
          - t3cloud/hardware
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test ./...

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: at-web
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: at-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  discord-notify:
    name: Discord CI alert
    needs: [go-test, web]
    if: ${{ always() && secrets.DISCORD_WEBHOOK_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Post CI status to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ needs.go-test.result }}" = "success" ] && [ "${{ needs.web.result }}" = "success" ]; then
            STATUS="✅ CI passed"
            COLOR=5763719
          else
            STATUS="❌ CI failed"
            COLOR=15548997
          fi

          curl -fsSL -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data "{\"embeds\":[{\"title\":\"$STATUS\",\"description\":\"Repository: ${{ github.repository }}\\nBranch: ${{ github.ref_name }}\\nWorkflow: ${{ github.workflow }}\\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"color\":$COLOR}]}"