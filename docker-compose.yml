      - ./deploy/apache2/docker/entrypoint.sh:/usr/local/apache2/conf/extra/entrypoint.sh:ro
      - ${APACHE_CERTS_DIR:-/etc/letsencrypt}:/usr/local/apache2/conf/letsencrypt:ro
    command: ["/bin/sh", "/usr/local/apache2/conf/extra/entrypoint.sh"]
    depends_on:
      api:
        condition: service_healthy
      app:
        condition: service_healthy
      console-app:
        condition: service_healthy
      enterprise-app:
        condition: service_healthy
      workspace-app:
        condition: service_healthy
      entity-app:
        condition: service_healthy
      equity-app:
        condition: service_healthy
      blog-media-app:
        condition: service_healthy
      login-api:
        condition: service_healthy
      login-app:
        condition: service_healthy

  cli:
    build:
      context: .
      dockerfile: ./atonixcorpcli/Dockerfile
    container_name: atonixcorp-cli
    profiles: ["devtools"]
    environment:
      ATONIXCORP_API_URL: http://api:8000
    command: ["atonixcorp", "sandbox-status"]
    depends_on:
      api:
        condition: service_healthy

  toolbox:
    build:
      context: .
      dockerfile: ./toolbox/Dockerfile
    container_name: atonixcorp-toolbox
    profiles: ["devtools"]
    command: ["atonixcorp-toolbox", "sandbox-entity", "1"]

  sdk-shell:
    build:
      context: .
      dockerfile: ./atonixcorpsdk/Dockerfile
    container_name: atonixcorp-sdk-shell
    profiles: ["devtools"]

  mobile-metro:
    build:
      context: .
      dockerfile: ./atonixcorpmobile/Dockerfile
    container_name: atonixcorp-mobile-metro
    profiles: ["mobile"]
    command: ["npx", "react-native", "start", "--host", "0.0.0.0", "--port", "8081"]
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./atonixcorpmobile:/app
      - /app/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:8081/status', (res) => { let body = ''; res.on('data', (chunk) => body += chunk); res.on('end', () => process.exit(body.trim() === 'packager-status:running' ? 0 : 1)); }).on('error', () => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  postgres_data:
