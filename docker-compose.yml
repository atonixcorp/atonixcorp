

x-api-environment: &api-environment
  DJANGO_SETTINGS_MODULE: atonixcorp_api.settings
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: ${DATABASE_URL:-postgres://atonixcorp:atonixcorppassword@db:5432/atonixcorp}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api.atonixcorp.com,atonixcorp.com,www.atonixcorp.com,login.atonixcorp.com}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://atonixcorp.com,https://www.atonixcorp.com,http://atonixcorp.com,http://www.atonixcorp.com}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://atonixcorp.com,https://www.atonixcorp.com,http://atonixcorp.com,http://www.atonixcorp.com}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://atonixcorp.com}
  BACKEND_BASE_URL: ${BACKEND_BASE_URL:-https://api.atonixcorp.com}
  APPROVAL_NOTIFICATION_BASE_URL: ${APPROVAL_NOTIFICATION_BASE_URL:-https://atonixcorp.com}
  AI_ENABLE_EXTERNAL_MODELS: ${AI_ENABLE_EXTERNAL_MODELS:-0}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_API_BASE_URL: ${ANTHROPIC_API_BASE_URL:-https://api.anthropic.com}
  CLAUDE_OPUS_MODEL: ${CLAUDE_OPUS_MODEL:-claude-opus-4-1}
  CLAUDE_SONNET_MODEL: ${CLAUDE_SONNET_MODEL:-claude-sonnet-4-0}
  AI_DEFAULT_MAX_TOKENS: ${AI_DEFAULT_MAX_TOKENS:-2000}
  BANKING_TOKEN_ENCRYPTION_KEY: ${BANKING_TOKEN_ENCRYPTION_KEY:-local-dev-banking-key-change-me}
  GOVERNANCE_SIGNING_KEY: ${GOVERNANCE_SIGNING_KEY:-}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-smtp-relay.brevo.com}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
  # REQUIRE_EMAIL_VERIFICATION is intentionally NOT set here: `environment` overrides
  # `env_file`, so pinning it would ignore api/.env. Set it in api/.env instead.
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@atonixcorp.com}
  ORGANIZATION_EMAIL_DOMAIN: ${ORGANIZATION_EMAIL_DOMAIN:-atonixcorp.com}
  PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
  PLAID_CLIENT_SECRET: ${PLAID_CLIENT_SECRET:-}
  PLAID_OAUTH_AUTHORIZE_URL: ${PLAID_OAUTH_AUTHORIZE_URL:-}
  YODLEE_CLIENT_ID: ${YODLEE_CLIENT_ID:-}
  YODLEE_CLIENT_SECRET: ${YODLEE_CLIENT_SECRET:-}
  YODLEE_OAUTH_AUTHORIZE_URL: ${YODLEE_OAUTH_AUTHORIZE_URL:-}
  FINICITY_CLIENT_ID: ${FINICITY_CLIENT_ID:-}
  FINICITY_CLIENT_SECRET: ${FINICITY_CLIENT_SECRET:-}
  FINICITY_OAUTH_AUTHORIZE_URL: ${FINICITY_OAUTH_AUTHORIZE_URL:-}
  BANKING_SYNC_INTERVAL_SECONDS: ${BANKING_SYNC_INTERVAL_SECONDS:-86400}
  APPROVAL_DIGEST_INTERVAL_SECONDS: ${APPROVAL_DIGEST_INTERVAL_SECONDS:-86400}
  APPROVAL_DIGEST_LOOKBACK_HOURS: ${APPROVAL_DIGEST_LOOKBACK_HOURS:-24}

x-api-service: &api-service
  build:
    context: ./api
    dockerfile: Dockerfile
  working_dir: /app
  init: true
  volumes:
    - ./api:/app
    - ./email-templates:/email-templates:ro
  env_file:
    - path: ./api/.env
      required: false
  environment: *api-environment

services:
  db:
    image: postgres:14-alpine
    container_name: atonixcorp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: atonixcorp
      POSTGRES_USER: atonixcorp
      POSTGRES_PASSWORD: atonixcorppassword
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atonixcorp -d atonixcorp"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api-migrate:
    <<: *api-service
    container_name: atonixcorp-api-migrate
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api-service
    container_name: atonixcorp-api
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/status', timeout=3)\" || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  banking-sync:
    <<: *api-service
    container_name: atonixcorp-banking-sync
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          python manage.py sync_banking_integrations;
          sleep "$${BANKING_SYNC_INTERVAL_SECONDS:-86400}";
        done
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  approval-digest:
    <<: *api-service
    container_name: atonixcorp-approval-digest
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          python manage.py send_approval_notification_digest --hours "$${APPROVAL_DIGEST_LOOKBACK_HOURS:-24}";
          sleep "$${APPROVAL_DIGEST_INTERVAL_SECONDS:-86400}";
        done
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: atonixcorp-app
    command: ["npm", "start"]
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    stdin_open: true
    tty: true
    volumes:
      - ./app:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      HOST: 0.0.0.0
      DANGEROUSLY_DISABLE_HOST_CHECK: "true"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000', (res) => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 40s

