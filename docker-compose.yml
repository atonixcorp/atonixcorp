services:
  db:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atonixcorp
      POSTGRES_USER: atonixcorp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atonixcorp-local-password}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atonixcorp -d atonixcorp"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_USER: atonixcorp
      DB_PASSWORD: ${POSTGRES_PASSWORD:-atonixcorp-local-password}
      DB_NAME: atonixcorp
      DB_PORT: "5432"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      CONTAINER_SECRET_KEY: ${CONTAINER_SECRET_KEY:?Set CONTAINER_SECRET_KEY in the root .env file}
      KUBECONFIG: /run/secrets/container-kubeconfig
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local-file}
      STORAGE_DATA_DIR: /var/lib/atonixcorp-storage
      CINDER_AUTH_URL: ${CINDER_AUTH_URL:-}
      CINDER_USERNAME: ${CINDER_USERNAME:-}
      CINDER_PASSWORD: ${CINDER_PASSWORD:-}
      CINDER_PROJECT_ID: ${CINDER_PROJECT_ID:-}
      CINDER_USER_DOMAIN_ID: ${CINDER_USER_DOMAIN_ID:-default}
      CINDER_REGION: ${CINDER_REGION:-}
      CINDER_INTERFACE: ${CINDER_INTERFACE:-public}
      CINDER_VOLUME_TYPE_IDS: ${CINDER_VOLUME_TYPE_IDS:-}
      CINDER_AVAILABILITY_ZONES: ${CINDER_AVAILABILITY_ZONES:-}
      CEILOMETER_API_URL: ${CEILOMETER_API_URL:-}
      OBSERVABILITY_PROMETHEUS_URL: ${OBSERVABILITY_PROMETHEUS_URL:-}
      OBSERVABILITY_PROMETHEUS_TOKEN: ${OBSERVABILITY_PROMETHEUS_TOKEN:-}
      OBSERVABILITY_SLURM_API_URL: ${OBSERVABILITY_SLURM_API_URL:-}
    volumes:
      - type: bind
        source: ${CONTAINER_KUBECONFIG:-/dev/null}
        target: /run/secrets/container-kubeconfig
        read_only: true
        bind:
          create_host_path: false
      - storage_data:/var/lib/atonixcorp-storage
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/bin/sh",
          "-c",
          "wget -q -O - http://127.0.0.1:8080/health >/dev/null",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  database:
    build:
      context: ./cloud/database
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: atonixcorp
      DB_PASSWORD: ${POSTGRES_PASSWORD:-atonixcorp-local-password}
      DB_NAME: atonixcorp
      DB_PORT: "5432"
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      DATABASE_CONFIG_DIR: /app/config
      DATABASE_API_ADDR: :8085
      OPENSTACK_AUTH_URL: ${OPENSTACK_AUTH_URL:-}
      OPENSTACK_USERNAME: ${OPENSTACK_USERNAME:-}
      OPENSTACK_PASSWORD: ${OPENSTACK_PASSWORD:-}
      OPENSTACK_USER_DOMAIN: ${OPENSTACK_USER_DOMAIN:-default}
      OPENSTACK_PROJECT_ID: ${OPENSTACK_PROJECT_ID:-}
      OPENSTACK_COMPUTE_ENDPOINT: ${OPENSTACK_COMPUTE_ENDPOINT:-}
      OPENSTACK_VOLUME_ENDPOINT: ${OPENSTACK_VOLUME_ENDPOINT:-}
      OPENSTACK_NETWORK_ENDPOINT: ${OPENSTACK_NETWORK_ENDPOINT:-}
      OPENSTACK_DATABASE_NETWORK_ID: ${OPENSTACK_DATABASE_NETWORK_ID:-}
      OPENSTACK_DATABASE_SECURITY_GROUP_ID: ${OPENSTACK_DATABASE_SECURITY_GROUP_ID:-}
      OPENSTACK_DATABASE_FLAVOR_BASIC: ${OPENSTACK_DATABASE_FLAVOR_BASIC:-}
      OPENSTACK_DATABASE_FLAVOR_STANDARD: ${OPENSTACK_DATABASE_FLAVOR_STANDARD:-}
      OPENSTACK_DATABASE_FLAVOR_PREMIUM: ${OPENSTACK_DATABASE_FLAVOR_PREMIUM:-}
      OPENSTACK_DATABASE_IMAGE_POSTGRES_16: ${OPENSTACK_DATABASE_IMAGE_POSTGRES_16:-}
      OPENSTACK_DATABASE_IMAGE_POSTGRES_17: ${OPENSTACK_DATABASE_IMAGE_POSTGRES_17:-}
      OPENSTACK_DATABASE_IMAGE_MYSQL_8_4: ${OPENSTACK_DATABASE_IMAGE_MYSQL_8_4:-}
      OPENSTACK_DATABASE_IMAGE_MARIADB_11_4: ${OPENSTACK_DATABASE_IMAGE_MARIADB_11_4:-}
      OPENSTACK_DATABASE_IMAGE_REDIS_7: ${OPENSTACK_DATABASE_IMAGE_REDIS_7:-}
    expose:
      - "8085"
    healthcheck:
      test: ["CMD", "/usr/local/bin/atdb-health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  compute:
    build:
      context: ./cloud/compute
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      COMPUTE_API_TOKEN: ${COMPUTE_API_TOKEN:?Set COMPUTE_API_TOKEN in the root .env file}
      COMPUTE_NODE_TOKEN: ${COMPUTE_NODE_TOKEN:?Set COMPUTE_NODE_TOKEN in the root .env file}
      COMPUTE_STORE_PATH: /var/lib/atonixcorp-compute/instances.json
    expose:
      - "8580"
    volumes:
      - compute_data:/var/lib/atonixcorp-compute
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8580/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  networking:
    build:
      context: ./cloud/network
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ATNETWORK_CONFIG_DIR: /etc/atnetwork/config
      ATNETWORK_MIGRATIONS_DIR: /app/migrations
      ATNETWORK_DATABASE_DSN: host=db user=atonixcorp password=${POSTGRES_PASSWORD:-atonixcorp-local-password} dbname=atonixcorp port=5432 sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
      DATABASE_API_URL: http://database:8085
      NETWORK_API_URL: http://networking:8080
      COMPUTE_API_URL: http://compute:8580
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
      compute:
        condition: service_healthy
      database:
        condition: service_healthy
      networking:
        condition: service_healthy

volumes:
  postgres_data:
  compute_data:
  storage_data: